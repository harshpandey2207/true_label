name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (15-minute idle threshold)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TrueLabel Render Backend
        run: |
          echo "Pinging TrueLabel backend at $(date)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://true-label-backend.onrender.com/)
          echo "Response code: $STATUS_CODE"
