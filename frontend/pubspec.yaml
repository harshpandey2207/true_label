name: true_label
description: Open-source-first package label screening and draft prototype

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  data_table_2: ^2.3.12
  sidebarx: ^0.17.1
  syncfusion_flutter_maps: ^24.1.41
  image_picker: ^1.2.3
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_svg: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/maps/
